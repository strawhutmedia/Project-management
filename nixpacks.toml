# Railway build override. Nixpacks normally auto-detects a Node app
# and builds it fine — we add ffmpeg here so the server can extract
# still frames from podcast episode MP4s for the social plan UI.
#
# nixPkgs is the canonical Nixpacks hook; aptPkgs alone wasn't
# enough to land ffmpeg in PATH on the runtime container (we hit
# "spawn ffmpeg ENOENT" on the first batch).
[phases.setup]
nixPkgs = ["nodejs_20", "ffmpeg"]
