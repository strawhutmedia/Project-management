# Railway build override. Nixpacks auto-detects Node fine; we don't
# need any extra system binaries. ffmpeg ships bundled via the
# @ffmpeg-installer/ffmpeg npm package (no PATH dependency) and the
# in-app Claude code-editing agent was removed, so git isn't needed
# at runtime either. Keeping the file as a hook for future additions.
[phases.setup]
nixPkgs = ["nodejs_20"]
