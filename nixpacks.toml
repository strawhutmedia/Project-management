# Railway build override. Nixpacks normally auto-detects a Node app
# and builds it fine — we add system binaries the runtime container
# needs:
#   - ffmpeg: stills + clip extraction from podcast MP4s
#   - git: the in-Slate Claude agent clones the repo and pushes
#     code changes from the running container
#
# nixPkgs is the canonical Nixpacks hook for system binaries.
[phases.setup]
nixPkgs = ["nodejs_20", "ffmpeg", "git"]
