<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="25%" stop-color="#fb7185"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="80%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded base, matches Slate's app chrome (#0b0d12). -->
  <rect width="32" height="32" rx="6" fill="#0b0d12"/>
  <!-- Clapboard top bar: dark backing + three angled white sticks. -->
  <rect x="3.5" y="5" width="25" height="6" rx="1" fill="#1a1d24"/>
  <polygon points="6,11 9,5 12,5 9,11" fill="#f4f1ea"/>
  <polygon points="14,11 17,5 20,5 17,11" fill="#f4f1ea"/>
  <polygon points="22,11 25,5 28,5 25,11" fill="#f4f1ea"/>
  <!-- Slate body in Slate's rainbow gradient. -->
  <rect x="3.5" y="12.5" width="25" height="14.5" rx="2" fill="url(#r)"/>
  <!-- Two faux "scene / take" lines inscribed on the slate. -->
  <rect x="7" y="17" width="11" height="1.6" rx="0.8" fill="#0b0d12" opacity="0.55"/>
  <rect x="7" y="21" width="15" height="1.6" rx="0.8" fill="#0b0d12" opacity="0.55"/>
</svg>
